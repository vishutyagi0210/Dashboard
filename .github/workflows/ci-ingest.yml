name: Ingest DevOps Reports

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger
  workflow_run:
    workflows: ["Build and Push Ingestion Image"]
    types:
      - completed

concurrency:
  group: dashboard-ingest
  cancel-in-progress: false

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write # Needed to commit data files back to the repo
      packages: read # Needed to pull the Docker image from GHCR
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Data Ingestion Engine
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD }} # Uses the PAT to query GitHub API
        run: |
          echo "Pulling Python Docker image and running ingestion..."
          # Note: Docker tags must be lowercase, we'll use the repository owner downcased.
          docker run --rm -v ${{ github.workspace }}/dashboard/public/data:/app/data ghcr.io/ot-container-kit/dashboard-ingestion-engine:latest || true
          echo "Data gathered and written to dashboard/public/data/"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "DevOps Dashboard Bot"
          git config --global user.email "bot@devops.local"
          git add dashboard/public/data/
          git commit -m "chore: Update dashboard reports and telemetry data" || echo "No changes to commit"
          git push
